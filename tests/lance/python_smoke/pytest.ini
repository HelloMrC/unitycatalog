[pytest]
# Pytest configuration for Lance smoke tests

# Register custom markers
markers =
    smoke: Smoke tests for quick validation
    phase1: Phase 1 metadata tests
    phase2: Phase 2 data plane tests
    s3: S3-compatible storage tests

# Default options
addopts = -v --tb=short --color=yes

# Test directories
testpaths = .

# Python files pattern
python_files = *_smoke.py

# Python classes pattern
python_classes = Test*

# Python functions pattern
python_functions = test_*